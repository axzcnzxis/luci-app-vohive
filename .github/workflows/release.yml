name: Release Packages

on:
  workflow_dispatch:
    inputs:
      plugin_version:
        description: LuCI plugin release tag
        required: true
        default: v0.1.19
      core_version:
        description: VoHive core release tag
        required: true
        default: v1.5.4
      core_repo:
        description: GitHub repository containing the core release
        required: true
        default: axzcnzxis/luci-app-vohive
  push:
    tags:
      - 'v*'

env:
  TZ: Asia/Shanghai
  PLUGIN_VERSION: ${{ github.event.inputs.plugin_version || github.ref_name || 'v0.1.19' }}
  CORE_VERSION: ${{ github.event.inputs.core_version || 'v1.5.4' }}
  CORE_REPO: ${{ github.event.inputs.core_repo || 'axzcnzxis/luci-app-vohive' }}

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release_meta.outputs.tag_name }}
      plugin_version: ${{ steps.release_meta.outputs.plugin_version }}
      core_version: ${{ steps.release_meta.outputs.core_version }}
      core_repo: ${{ steps.release_meta.outputs.core_repo }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve versions
        id: release_meta
        run: |
          set -eu
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag_name="${GITHUB_REF_NAME}"
            plugin_version="${GITHUB_REF_NAME}"
          else
            tag_name="${PLUGIN_VERSION}"
            plugin_version="${PLUGIN_VERSION}"
          fi

          plugin_norm="${plugin_version#v}"
          previous_tag="$(git tag --sort=-v:refname --merged HEAD | grep -v "^${tag_name}$" | head -n 1 || true)"

          {
            echo "## VoHive LuCI ${plugin_norm}"
            echo
            echo "### 更新日志"
            echo
            if [ -n "$previous_tag" ]; then
              git log --pretty=format:'- %s (%h)' "${previous_tag}..HEAD"
            else
              git log --pretty=format:'- %s (%h)' -n 20
            fi
            echo
            echo
            echo "### 安装包说明"
            echo
            echo "- luci-app-vohive: LuCI 管理页面，不包含 VoHive core。安装后可在页面下载/安装核心。"
            echo "- vohive-core-amd64: 预置 VoHive core ${CORE_VERSION}，来源仓库 ${CORE_REPO}。"
            echo
            echo "### 包格式"
            echo
            echo "- OpenWrt 24.10 SDK: .ipk"
            echo "- OpenWrt 25.12 SDK: .apk"
            echo
            echo "### 架构选择"
            echo
            echo "- 当前只发布 x86_64 / amd64 核心包。"
            echo
            if [ -n "$previous_tag" ]; then
              echo "完整对比: https://github.com/${GITHUB_REPOSITORY}/compare/${previous_tag}...${tag_name}"
            fi
          } > release-notes.md

          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "plugin_version=${plugin_version}" >> "$GITHUB_OUTPUT"
          echo "core_version=${CORE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "core_repo=${CORE_REPO}" >> "$GITHUB_OUTPUT"

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  build:
    name: Build ${{ matrix.label }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: openwrt_24_ipk
            label: OpenWrt 24.10 IPK
          - id: openwrt_25_apk
            label: OpenWrt 25.12 APK

    steps:
      - name: Install packages
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install zstd build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 rsync unzip zlib1g-dev file wget curl
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: source

      - name: Import SDK environment
        id: sdk_env
        run: |
          cat "source/.github/workflows/${{ matrix.id }}.env" >> "$GITHUB_ENV"
          while IFS='=' read -r key value; do
            echo "${key,,}=${value}" >> "$GITHUB_OUTPUT"
          done < "source/.github/workflows/${{ matrix.id }}.env"

      - name: Download and verify VoHive core
        env:
          CORE_VERSION: ${{ needs.prepare.outputs.core_version }}
          CORE_REPO: ${{ needs.prepare.outputs.core_repo }}
        run: |
          set -eu
          mkdir -p source/vohive-core/files
          arch=amd64
          asset="vohive_${CORE_VERSION}_linux_${arch}"
          base="https://github.com/${CORE_REPO}/releases/download/${CORE_VERSION}"

          curl -fL --connect-timeout 20 --retry 3 "$base/$asset" -o "source/vohive-core/files/vohive-${arch}"
          curl -fL --connect-timeout 20 --retry 3 "$base/sha256sums.txt" -o sha256sums.txt

          expected="$(awk -v f="$asset" '$2 == f || $2 == "*" f {print $1; exit}' sha256sums.txt)"
          actual="$(sha256sum "source/vohive-core/files/vohive-${arch}" | awk '{print $1}')"
          [ -n "$expected" ] && [ "$actual" = "$expected" ]

          chmod 0755 "source/vohive-core/files/vohive-${arch}"
          file "source/vohive-core/files/vohive-${arch}"

      - name: Initialize SDK
        env:
          SDK_FILE: ${{ steps.sdk_env.outputs.sdk_name }}.${{ steps.sdk_env.outputs.sdk_ext }}
          SDK_SOURCE: ${{ steps.sdk_env.outputs.sdk_url }}${{ steps.sdk_env.outputs.sdk_name }}.${{ steps.sdk_env.outputs.sdk_ext }}
        run: |
          set -eu
          wget "$SDK_SOURCE"
          mkdir -p sdk
          if [ "${SDK_EXT}" = "tar.zst" ]; then
            tar --zstd -xf "$SDK_FILE" -C sdk --strip-components=1
          else
            tar -xf "$SDK_FILE" -C sdk --strip-components=1
          fi

          cd sdk
          cat <<EOF > feeds.conf
          src-git base https://github.com/openwrt/openwrt.git;${FEED_BRANCH}
          src-git packages https://github.com/openwrt/packages.git;${FEED_BRANCH}
          src-git luci https://github.com/openwrt/luci.git;${FEED_BRANCH}
          src-git routing https://git.openwrt.org/feed/routing.git;${FEED_BRANCH}
          src-link vohive $(pwd)/../source
          EOF
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds install -a -p vohive

          cat <<'EOF' > .config
          CONFIG_ALL_NONSHARED=n
          CONFIG_ALL_KMODS=n
          CONFIG_ALL=n
          CONFIG_AUTOREMOVE=n
          CONFIG_PACKAGE_luci-app-vohive=m
          CONFIG_PACKAGE_vohive-core-amd64=m
          EOF
          make defconfig
          make clean

      - name: Compile packages
        env:
          PLUGIN_VERSION: ${{ needs.prepare.outputs.plugin_version }}
          CORE_VERSION: ${{ needs.prepare.outputs.core_version }}
        run: |
          set -eu
          cd sdk
          ./scripts/feeds update vohive
          ./scripts/feeds install -a -p vohive

          plugin_pkg_version="${PLUGIN_VERSION#v}"
          make package/feeds/vohive/luci-app-vohive/clean PKG_VERSION="$plugin_pkg_version" || true
          if ! make package/feeds/vohive/luci-app-vohive/compile -j"$(nproc)" PKG_VERSION="$plugin_pkg_version"; then
            make package/feeds/vohive/luci-app-vohive/compile -j1 V=s PKG_VERSION="$plugin_pkg_version"
          fi

          make package/feeds/vohive/vohive-core/clean VOHIVE_VERSION="$CORE_VERSION" || true
          if ! make package/feeds/vohive/vohive-core/compile -j"$(nproc)" VOHIVE_VERSION="$CORE_VERSION"; then
            make package/feeds/vohive/vohive-core/compile -j1 V=s VOHIVE_VERSION="$CORE_VERSION"
          fi

          package_dir="$(pwd)/bin/packages/${SDK_ARCH}/vohive"
          dist_dir="$(pwd)/../dist/${{ matrix.id }}"
          mkdir -p "$dist_dir"

          shopt -s nullglob
          package_files=("$package_dir"/*.${PACKAGE_EXT})
          if [ ${#package_files[@]} -eq 0 ]; then
            echo "No .${PACKAGE_EXT} packages were produced in ${package_dir}" >&2
            exit 1
          fi

          cp "$package_dir"/*.${PACKAGE_EXT} "$dist_dir"/
          cp "$package_dir"/Packages* "$dist_dir"/ 2>/dev/null || true
          cp "$package_dir"/APKINDEX* "$dist_dir"/ 2>/dev/null || true

          {
            echo "Plugin tag: ${{ needs.prepare.outputs.tag_name }}"
            echo "Plugin version: $plugin_pkg_version"
            echo "VoHive core: ${CORE_VERSION}"
            echo "Core repository: ${{ needs.prepare.outputs.core_repo }}"
            echo "Build: ${{ matrix.label }}"
            echo "Build ID: ${{ matrix.id }}"
            echo "SDK: ${SDK_NAME}"
            echo "Package format: ${PACKAGE_EXT}"
            echo "Package count: ${#package_files[@]}"
          } > "$dist_dir/BUILD-INFO.txt"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vohive-${{ matrix.id }}
          path: dist/${{ matrix.id }}
          retention-days: 7

  release:
    name: Publish Release
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: vohive-*
          merge-multiple: false

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: release-notes

      - name: Collect release assets
        run: |
          set -eu
          mkdir -p releases
          shopt -s nullglob

          for dir in artifacts/*; do
            [ -d "$dir" ] || continue
            for package in "$dir"/*.ipk "$dir"/*.apk; do
              [ -f "$package" ] || continue
              cp "$package" releases/
            done
            [ -f "$dir/BUILD-INFO.txt" ] && cp "$dir/BUILD-INFO.txt" "releases/$(basename "$dir")-BUILD-INFO.txt"
          done

          (cd releases && sha256sum *.ipk *.apk 2>/dev/null > sha256sums.txt || true)
          ls -lh releases

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          body_path: release-notes/release-notes.md
          files: releases/*
